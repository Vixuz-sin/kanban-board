<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanban Board</title>
  <meta name="description" content="A simple drag-and-drop task board that saves in your browser.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Kanban Board</h1>
    <p>Drag cards between columns, or use the arrow buttons. Double-click a card to edit. Everything is saved in your browser.</p>
  </header>
  <main id="board" class="board"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
